name: Continuous Integration

on:
  push:
    branches: [ development ]
  pull_request:
    branches: [ development ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ interaction, profile, auth ]

    steps:
      - uses: actions/checkout@v2
      
      - name: Setup Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '16.x'

      - name: Install Dependencies
        run: npm ci
        working-directory: ./${{ matrix.service }}
        
  unit-test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ interaction ]

    defaults:
      run:
        working-directory: ./${{ matrix.service }}

    steps:
      - uses: actions/checkout@v2

      - name: Setup Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '16.x'

      - name: Install Dependencies
        run: npm ci

      - name: Run tests
        env:
          NODE_ENV: test
        run: npm test
        working-directory: ./${{ matrix.service }}
  
  integration-test:
    needs: unit-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./integration_test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install Dependencies
        run: npm ci

      - name: Run Integration Tests
        env:
          AMQP_URL: amqp://guest:guestrabbitmq:5672
        run: npm test

  sonarqube:
    name: SonarQube Scan
    needs: integration-test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ interaction ]

    defaults:
      run:
        working-directory: ./${{ matrix.service }}

    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - name: Install Dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}