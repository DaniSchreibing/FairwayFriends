apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
        - name: auth
          image: 367074/auth:latest
          envFrom:
            - configMapRef:
                name: secrets
          ports:
            - containerPort: 3002